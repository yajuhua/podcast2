name: build latest
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true
        type: string
      docker:
        description: 'build and pull docker'
        required: true
        type: boolean
      package:
        description: 'build installation package'
        required: true
        type: boolean
      release:
        required: true
        type: boolean           

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          mvn package -Dpodcast2Version=$version
        env:
          version: ${{ inputs.version }}
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/  # 上传 target 目录

  build-and-push-docker:
    if: ${{ inputs.docker }}
    needs: build-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: .    

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}

      - name: Build and push (multi-platform)
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          tags: |
            yajuhua/podcast2:${{ inputs.version }}
            yajuhua/podcast2:latest
          platforms: linux/amd64,linux/arm64

  build-installation-package:
    if: ${{ inputs.package }}
    permissions: write-all
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - uses: actions/checkout@v4

      - name: Create tmp directory
        run: |
          mkdir tmp
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: tmp/

      - name: Build windows
        run: |
          ls
          cp tmp/app.jar .
          unzip tmp/app.jar
          curl -L -o platform/windows/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          cp -rf BOOT-INF/classes BOOT-INF/lib platform/windows/
          zip -r podcast2-win-x64.zip platform/windows/ 
          md5sum podcast2-win-x64.zip >> md5.txt

      - name: Build osx
        run: |
          curl -L -o platform/osx/yt-dlp "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos_legacy"
          chmod a+x platform/osx/yt-dlp
          cp -rf BOOT-INF/classes BOOT-INF/lib platform/osx/
          zip -r podcast2-osx-x64.zip platform/osx/ 
          md5sum podcast2-osx-x64.zip >> md5.txt
          md5sum app.jar >> md5.txt

      - name: Release
        if: ${{ inputs.release }}    
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ inputs.version }}"
          prerelease: false
          title: "${{ inputs.version }}"
          files: |
            podcast2-win-x64.zip
            podcast2-osx-x64.zip
            app.jar
            md5.txt
            
  update-info:
    if: ${{ inputs.docker == 'true' && inputs.package == 'true' }}
    permissions: write-all
    runs-on: ubuntu-latest
    needs: [build-installation-package,build-and-push-docker]
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update pom.xml
        run: |
          sed -i "s/^\([[:space:]]*\)<podcast2Version>.*<\/podcast2Version>/\1<podcast2Version>$version<\/podcast2Version>/" pom.xml
        env:
          version: ${{ inputs.version }}

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Release $version" || echo "No changes to commit"
          git push
        env:
          version: ${{ inputs.version }}            
